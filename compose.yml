services:
  config-server:
    build:
      context: ./config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/perito-service/prod"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  db-nomeacoes:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nomeacoes
      POSTGRES_USER: nomeacoes
      POSTGRES_PASSWORD: ${NOMEACOES_DB_PASSWORD:?Defina NOMEACOES_DB_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - dados-nomeacoes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomeacoes -d nomeacoes"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-peritos:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peritos
      POSTGRES_USER: peritos
      POSTGRES_PASSWORD: ${PERITOS_DB_PASSWORD:?Defina PERITOS_DB_PASSWORD no arquivo .env}
    ports:
      - "5434:5432"
    volumes:
      - dados-peritos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peritos -d peritos"]
      interval: 5s
      timeout: 3s
      retries: 20

  perito-service:
    build:
      context: ./perito-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_URL: jdbc:postgresql://db-peritos:5432/peritos
      DB_USERNAME: peritos
      DB_PASSWORD: ${PERITOS_DB_PASSWORD:?Defina PERITOS_DB_PASSWORD no arquivo .env}
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      db-peritos:
        condition: service_healthy

  aplicacao-principal:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_URL: jdbc:postgresql://db-nomeacoes:5432/nomeacoes
      DB_USERNAME: nomeacoes
      DB_PASSWORD: ${NOMEACOES_DB_PASSWORD:?Defina NOMEACOES_DB_PASSWORD no arquivo .env}
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      db-nomeacoes:
        condition: service_healthy
      perito-service:
        condition: service_started

volumes:
  dados-nomeacoes:
  dados-peritos:
